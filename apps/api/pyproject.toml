[project]
name = "industrial-platform-api"
version = "0.1.0"
description = "ForgeX — AI-Powered Industrial Intelligence Platform — FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.112.0",
    "uvicorn[standard]==0.30.5",
    "pydantic==2.8.2",
    "pydantic-settings==2.4.0",
    "sqlalchemy==2.0.32",
    "asyncpg==0.29.0",
    "psycopg[binary]==3.2.1",
    "alembic==1.13.2",
    "redis==5.0.8",
    "structlog==24.4.0",
    "python-json-logger==2.0.7",
    "pyjwt==2.9.0",
    "passlib[argon2,bcrypt]==1.7.4",
    "bcrypt==4.0.1",  # passlib 1.7.4 predates bcrypt >=4.1's API changes; pinned to avoid a real runtime crash (see docs/adr/0018)
    "pillow==10.4.0",
    "python-multipart==0.0.9",
    "email-validator==2.2.0",
    "httpx==0.27.0",  # real runtime dependency since Module 5C's MCADataGovInAdapter — not just a test-client dependency; found and fixed during Module 6B's environment setup (previously only listed under [project.optional-dependencies].dev, which would have made a real production deployment crash with ImportError)
    "pypdf==6.16.2",  # Checkpoint 1 of the Document -> Structured Product Data design — pure-Python PDF text-layer reader, no OCR, no network calls, no paid API; chosen specifically because it never renders or executes a PDF, only reads its own text objects
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-asyncio==0.24.0",
    "ruff==0.5.7",
    "mypy==1.11.1",
    "types-passlib==1.7.7.20240819",
    "coverage==7.6.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["alembic/versions"]

# asyncpg ships no type stubs/py.typed marker — used directly (not via
# SQLAlchemy) for the startup connectivity check, see app/main.py.
[[tool.mypy.overrides]]
module = "asyncpg"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
