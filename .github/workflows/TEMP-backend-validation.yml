# ============================================================================
# TEMPORARY — diagnostic only. NOT part of the reviewed feature set.
#
# Sole purpose: get real execution evidence for the admin document-
# verification workflow's backend tests (b24b358..fc8e2f8, PR #3) against
# an isolated CI PostgreSQL/Redis service, since the real `api` job in
# ci.yml currently cannot reach mypy/pytest — it stops at `ruff format
# --check .` on three pre-existing, unrelated files (app/services/
# data_quality_service.py, app/services/email_service.py,
# tests/test_evidence_pilot.py) that are explicitly out of scope for
# PR #3 and are not being fixed here.
#
# This workflow deliberately skips both ruff steps — not via
# continue-on-error, just omitted — because their status on this exact
# commit is already fully known from the real `api` job's own run.
# Everything else (services, env, Python version, dependency install,
# mypy, pytest) is an exact copy of ci.yml's `api` job.
#
# workflow_dispatch only: never runs automatically, never becomes a
# status check on any PR. Manually triggered once, then this file is
# deleted in a separate follow-up commit — see PR #3 / continue-wip
# commit history for the removal commit immediately after this one.
# ============================================================================

name: TEMP Backend Validation (diagnostic only, not part of PR review)

on:
  workflow_dispatch: {}

jobs:
  backend-validation:
    name: TEMP - mypy + pytest against isolated CI Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-bookworm
        env:
          POSTGRES_USER: platform_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: industrial_platform_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform_user -d industrial_platform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-bookworm
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://platform_user:test_password@localhost:5432/industrial_platform_test
      DATABASE_URL_SYNC: postgresql+psycopg://platform_user:test_password@localhost:5432/industrial_platform_test
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Typecheck (mypy)
        run: mypy app

      - name: Test (pytest)
        run: pytest --cov=app --cov-report=term-missing -v
